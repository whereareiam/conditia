[versions]

# plugins
toolkit = "0.3.0"
freefair = "9.8.3"

# compile time processing
lombok = "1.18.48"

# general
annotations = "26.1.0"
configura = "dev-ff0a18a"
jackson = "2.23.0"
chassis = "dev-c97206f"
snakeyaml = "2.7"

# testing
junit = "6.1.3"

[libraries]

# compile time processing
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
lombok-plugin = { group = "io.freefair.gradle", name = "lombok-plugin", version.ref = "freefair" }
toolkit-publish-maven = { group = "me.whereareiam.toolkit", name = "publish-maven", version.ref = "toolkit" }

# general
annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }
configura = { group = "me.whereareiam", name = "configura", version.ref = "configura" }
configura-api = { group = "me.whereareiam", name = "configura-api", version.ref = "configura" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
chassis-api = { group = "me.whereareiam.chassis", name = "chassis-api", version.ref = "chassis" }
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }

# testing
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }

[plugins]
toolkit-versioning = { id = "me.whereareiam.toolkit.versioning", version.ref = "toolkit" }
