name: Suggestion
description: Suggest a new feature or a change to existing behavior.
labels:
  - suggestion
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What your host or condition type is trying to do and what stops you today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How Conditia could solve it, for hosts and for condition types.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other solutions you considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Binding
        - Evaluation
        - Configuration
        - Named lists
        - Scopes
        - Built-in types
        - Configura
        - Chassis
        - Testing
        - API
        - Other
